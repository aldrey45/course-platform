name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Detects which service folders changed in this push/PR.
  # Downstream jobs only run if their folder is in the change set —
  # this is the core monorepo CI pattern: don't test what didn't change.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      enrollment: ${{ steps.filter.outputs.enrollment }}
      notification: ${{ steps.filter.outputs.notification }}
      gateway: ${{ steps.filter.outputs.gateway }}
      course: ${{ steps.filter.outputs.course }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'auth-service/**'
            enrollment:
              - 'enrollment-service/**'
            notification:
              - 'notification-service/**'
            gateway:
              - 'gateway/**'
            course:
              - 'course-service/**'

  auth-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_user -d auth_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://auth_user:auth_pass@localhost:5432/auth_db
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: auth-service/package-lock.json
      - run: npm install
      - run: npm test

  enrollment-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.enrollment == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enrollment-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enrollment_db
          POSTGRES_USER: enrollment_user
          POSTGRES_PASSWORD: enrollment_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enrollment_user -d enrollment_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://enrollment_user:enrollment_pass@localhost:5432/enrollment_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: enrollment-service/package-lock.json
      - run: npm install
      - run: npm test

  notification-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.notification == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-service
    # A service container: GitHub Actions spins up a real Redis instance
    # alongside the job, reachable at localhost:6379 for the duration of
    # this job only. This is how you test something that genuinely needs
    # a real dependency, instead of mocking it away.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notification-service/package-lock.json
      - run: npm install
      - run: npm test

  gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm install
      - run: npm test

  course-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.course == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-service
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test